<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explore Uttara Kannada – Karavali Trails</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<header class="site-header" id="site-header"></header>
<main class="container page">
  <h1 class="page-title">Explore Uttara Kannada</h1>
  <p class="muted">Beaches, waterfalls, temples, forests and forts. Coordinates marked approximate should be checked on OpenStreetMap before you travel.</p>
  <div class="toolbar"><div class="tabs" id="tabs"></div><input id="q" type="search" placeholder="Search destinations" aria-label="Search destinations"></div>
  <div class="grid card-grid" id="cards"></div>

  <section id="map-section" class="map-section">
    <h2>Interactive map of Uttara Kannada</h2>
    <div class="toolbar"><input id="mapq" type="search" placeholder="Search the map" aria-label="Search the map"><button class="btn btn-small btn-outline" id="resetMap">Reset map view</button></div>
    <div class="legend" id="legend"></div>
    <p class="muted small" id="mapcount"></p>
    <div id="map" class="map-box" role="application" aria-label="Map of tourist destinations"></div>
  </section>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="js/app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="js/map.js"></script>
<script src="js/destinations.js"></script>
</body></html>
