<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account – Karavali Trails</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<header class="site-header" id="site-header"></header>
<main class="auth-wrap">
  <form id="regForm" class="form-card" novalidate>
    <h1>Create your account</h1>
    <p class="muted">It takes a minute. You need a 10-digit mobile number.</p>
    <p id="msg" class="msg" hidden></p>
    <label class="field">Full name<input name="name" autocomplete="name" required></label>
    <label class="field">Mobile number<input name="mobile" inputmode="numeric" maxlength="10" autocomplete="username" required></label>
    <label class="field">Password (8+ characters)<input name="password" type="password" autocomplete="new-password" required></label>
    <label class="field">Confirm password<input name="confirmPassword" type="password" autocomplete="new-password" required></label>
    <button class="btn wide" type="submit">Create Account</button>
    <p class="alt">Already registered? <a href="login.html">Login</a></p>
  </form>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body></html>
