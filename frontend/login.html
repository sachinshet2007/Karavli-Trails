<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login – Karavali Trails</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<header class="site-header" id="site-header"></header>
<main class="auth-wrap">
  <form id="loginForm" class="form-card" novalidate>
    <h1>Welcome back</h1>
    <p class="muted">Log in to plan and save your trips.</p>
    <p id="msg" class="msg" hidden></p>
    <label class="field">Mobile number<input name="mobile" inputmode="numeric" maxlength="10" autocomplete="username" required></label>
    <label class="field">Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn wide" type="submit">Login</button>
    <p class="alt">New here? <a class="btn btn-outline btn-small" href="createAccount.html">Create Account</a></p>
  </form>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body></html>
