<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin – Karavali Trails</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<header class="site-header" id="site-header"></header>
<main class="container page">
  <h1 class="page-title">Admin Dashboard</h1>
  <div id="adminLogin" hidden><form id="adminForm" class="form-card"><h2>Admin login</h2><p class="muted">For administrators only.</p><p id="aMsg" class="msg" hidden></p>
    <label class="field">Username<input name="username" autocomplete="username" required></label><label class="field">Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn wide" type="submit">Login</button></form></div>
  <div id="adminApp" hidden>
    <div class="tabs" id="aTabs"></div>
    <div class="toolbar"><button class="btn btn-small" id="addBtn">Add new</button></div>
    <p id="aInfo" class="msg" hidden></p><div id="aTable"></div>
  </div>
</main>
<dialog id="aDlg"><form id="aForm" class="dlg-form"><h3 id="aDlgTitle"></h3><div id="aFields"></div><p id="aFormMsg" class="msg" hidden></p>
  <div class="actions"><button class="btn" type="submit">Save</button><button class="btn btn-outline" type="button" id="aCancel">Cancel</button></div></form></dialog>
<footer class="site-footer" id="site-footer"></footer>
<script src="js/app.js"></script>
<script src="js/admin.js"></script>
</body></html>
