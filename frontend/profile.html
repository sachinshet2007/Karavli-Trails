<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Profile – Karavali Trails</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<header class="site-header" id="site-header"></header>
<main class="container page">
  <h1 class="page-title">My Profile</h1>
  <div class="grid two">
    <form id="profileForm" class="form-card wide-card"><h2>Your details</h2><p id="pMsg" class="msg" hidden></p>
      <label class="field">Full name<input name="name" required></label><label class="field">Mobile number<input name="mobile" inputmode="numeric" maxlength="10" required></label>
      <button class="btn" type="submit">Update profile</button></form>
    <form id="pwForm" class="form-card wide-card"><h2>Change password</h2><p id="wMsg" class="msg" hidden></p>
      <label class="field">Current password<input name="current" type="password" autocomplete="current-password" required></label>
      <label class="field">New password (8+ characters)<input name="newPassword" type="password" autocomplete="new-password" required></label>
      <label class="field">Confirm new password<input name="confirm" type="password" autocomplete="new-password" required></label>
      <button class="btn" type="submit">Change password</button></form>
  </div>
  <section id="trips-section"><h2 id="tripsHead">Saved trips</h2><div class="grid card-grid" id="trips"><p class="loading">Loading…</p></div></section>
  <section><h2>Bike rental requests</h2><div id="requests"><p class="loading">Loading…</p></div></section>
  <p><button class="btn btn-outline" onclick="document.getElementById('logoutBtn').click()">Logout securely</button></p>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="js/app.js"></script>
<script src="js/profile.js"></script>
</body></html>
